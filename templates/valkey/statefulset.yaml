{{- if .Values.valkey.deploy }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "langfuse.fullname" . }}-valkey-headless
  labels:
    {{- include "langfuse.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  type: ClusterIP
  clusterIP: None
  # 起動スクリプトがPod同士のホスト名を解決できるよう、Ready前のPodもDNSに載せる
  publishNotReadyAddresses: true
  ports:
    - name: tcp-valkey
      port: 6379
      targetPort: valkey
      protocol: TCP
    - name: tcp-sentinel
      port: 26379
      targetPort: sentinel
      protocol: TCP
  selector:
    {{- include "langfuse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "langfuse.fullname" . }}-valkey
  labels:
    {{- include "langfuse.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  replicas: {{ .Values.valkey.replicaCount }}
  serviceName: {{ include "langfuse.fullname" . }}-valkey-headless
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "langfuse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        {{- include "langfuse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: valkey
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/valkey/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "langfuse.serviceAccountName" . }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "langfuse.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: valkey
              topologyKey: kubernetes.io/hostname
        {{- with .Values.affinity.nodeAffinity }}
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: valkey
          image: valkey/valkey:9-alpine
          imagePullPolicy: IfNotPresent
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - /scripts/start-valkey.sh
          env:
            {{- include "langfuse.valkey.env" . | nindent 12 }}
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/valkey/valkey.conf
              subPath: valkey.conf
              readOnly: true
            - name: config
              mountPath: /scripts
              readOnly: true
        - name: sentinel
          image: valkey/valkey:9-alpine
          imagePullPolicy: IfNotPresent
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - /scripts/start-sentinel.sh
          env:
            {{- include "langfuse.valkey.env" . | nindent 12 }}
            - name: QUORUM
              value: {{ add (div (int .Values.valkey.replicaCount) 2) 1 | quote }}
          ports:
            - name: sentinel
              containerPort: 26379
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: sentinel-data
              mountPath: /data
            - name: config
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: sentinel-data
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "langfuse.fullname" . }}-valkey-config
{{- end }}
